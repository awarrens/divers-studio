# Render Blueprint for divers.studio.
#
# Two static sites off one repo, one per concept, each pinned to its own
# branch so they get separate URLs and neither can disturb the other:
#
#   main         concept one, the dark filmstrip      (live, do not disturb)
#   concept-two  the light scroll-driven stack
#
# There is no build step in either. The site is plain HTML/CSS/JS served from
# the repo root, so staticPublishPath is "." and buildCommand stays empty.
#
# NOTE: a Blueprint only configures Blueprint-managed services. The existing
# concept one service was created by hand in the dashboard, so it keeps its
# own settings and ignores this file. A new service created by hand needs its
# Branch and Publish Directory set there too.

services:
  - type: web
    name: divers-studio
    runtime: static
    branch: main
    staticPublishPath: .
    autoDeploy: true

  - type: web
    name: divers-studio-concept-two
    runtime: static
    branch: concept-two
    staticPublishPath: .
    autoDeploy: true
